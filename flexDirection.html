<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex direction</title>
    <style>
      /* flex-direction makes the item in the flex box appear columnwise; if flex-direction is set to column. In default the flex-direction is set to row. */
      .container {
        display: flex;
        flex-direction: column;
      }
      div > div {
        width: 300px;
        height: 250px;
        background-color: cornflowerblue;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
