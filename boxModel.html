<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 100%;
        /* display: inline-block; */
      }
      div > div {
        width: 300px;
        height: 300px;
        display: inline-block;
      }
      div > div:nth-of-type(1) {
        background-color: chartreuse;
        padding: 10px;
        border: 1px solid rgb(26, 45, 8);
        margin: 3px;
      }
      div > div:nth-of-type(2) {
        background-color: cornflowerblue;
        padding: 14px;
        border: 1px solid rgb(5, 20, 49);
        margin: 4px;
        box-sizing: content-box;
      }
      div > div:nth-of-type(3) {
        background-color: darkorange;
        padding: 15px;
        border: 1px solid rgb(68, 42, 10);
        margin: 5px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div>
      <div>BOX 1</div>
      <div>BOX 2</div>
      <div>BOX 3</div>
    </div>
  </body>
</html>
