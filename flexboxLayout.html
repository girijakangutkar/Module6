<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layout</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
      }
      div > div {
        width: 250px;
        height: 200px;
        margin: 5px;
      }
      div > div:nth-of-type(1) {
        background-color: chocolate;
      }
      div > div:nth-of-type(2) {
        background-color: rgb(63, 210, 30);
      }
      div > div:nth-of-type(3) {
        background-color: rgb(30, 69, 210);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
