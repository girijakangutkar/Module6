<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Layout</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .container {
        display: flex;
        justify-content: center;
        width: 100%;
        /* margin-left: auto;
        margin-right: auto; */
      }
      .col1 {
        width: 30%;
        margin: 10px;
        /* border: 1px solid black; */
      }
      .col1 h1 {
        text-align: center;
      }
      .col1 h3 {
        color: blueviolet;
        font-weight: bold;
        font-size: 20px;
        line-height: 0.5px;
        text-align: center;
      }
      .col2 {
        width: 50%;
        justify-content: center;
        text-align: justify;
        padding: 10px;
        margin: 10px;
        /* border: 1px solid black; */
      }
      .part1 {
        width: 20%;
        /* border: 1px solid black; */
      }

      .part2 {
        width: 20%;
        /* border: 1px solid black; */
        justify-items: center;
      }

      .part4,
      .part3 {
        width: 25%;
        /* border: 1px solid black; */
      }

      .part1 h2 {
        text-align: left;
        margin-left: 20%;
      }

      .part4 {
        align-content: center;
        justify-items: center;
        text-align: right;
      }

      .part3 h1 {
        text-align: center;
      }

      .part4 button {
        background-color: blueviolet;
        padding: 15px;
        color: white;
        margin-right: 15%;
        font-weight: bold;
        border: none;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      function RightPlan({ title, subTitle, content }) {
        return (
          <div class="container">
            <div class="col1">
              <h1>{title}</h1>
              <h3>{subTitle}</h3>
            </div>
            <div class="col2">
              <p>{content}</p>
            </div>
          </div>
        );
      }

      function Cards({ title, list, price, button }) {
        return (
          <div class="container">
            <div class="part1">
              <h2>{title}</h2>
            </div>
            <div class="part2">
              <ul>
                {list.map((ele, index) => (
                  <li key={index}>{ele}</li>
                ))}
              </ul>
            </div>
            <div class="part3">
              <h1>{price}</h1>
            </div>
            <div class="part4">
              <button>{button}</button>
            </div>
          </div>
        );
      }

      function App() {
        let list1 = ["A", "B", "C"];
        let list2 = ["X", "Y", "Z"];
        let list3 = ["P", "Q", "R"];
        return (
          <>
            <RightPlan
              title="The Right Plan for"
              subTitle="Your Business"
              content="Lorem ipsum, dolor sit amet consectetur adipisicing elit. Excepturi minus dolorum, temporibus atque quibusdam aliquam iure minima ab voluptas at culpa neque, quaerat, repellat eum! Illum quidem fuga provident animi?"
            />
            <hr />
            <Cards
              title="Stater"
              list={list1}
              price="free"
              button="Get Started"
            />
            <hr />
            <Cards
              title="Lorem Plan"
              list={list2}
              price="$32.00"
              button="Get Started"
            />
            <hr />
            <Cards
              title="Lorem Pro"
              list={list3}
              price="$50.00"
              button="Get Started"
            />
          </>
        );
      }

      let root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
