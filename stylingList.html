<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styling list with pseudo classes</title>
    <style>
      li:first-child {
        font-weight: bold;
      }
      /* li:nth-child(2) {
        background-color: azure;
      } */
      li + li {
        background-color: rgba(137, 43, 226, 0.285);
      }
      li:nth-of-type(3) {
        font-style: italic;
      }
      li {
        font-style: italic;
      }
      li:hover {
        background-color: rgb(89, 177, 180);
      }
    </style>
  </head>
  <body>
    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ol>
  </body>
</html>
