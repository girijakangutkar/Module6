<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styling with Descendant child combinator</title>
    <style>
      div p {
        color: blue;
      }
      div > P {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div>
      <p>Inside div</p>
      <section>
        <p>I am inside section</p>
      </section>
    </div>
  </body>
</html>
