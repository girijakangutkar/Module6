<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle movement</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      function BlogCard({ title, content, isFeatured }) {
        const [show, setShow] = useState(false);

        const cardStyle = {
          border: "1px solid gray",
          padding: "10px",
          backgroundColor: isFeatured ? "lightyellow" : "white",
        };

        return (
          <div style={cardStyle}>
            <h2>{title}</h2>
            <button onClick={() => setShow(!show)}>
              {show ? "Hide Content" : "Show Content"}
            </button>
            {show && <p>{content}</p>}
          </div>
        );
      }

      // function showContent({ content }) {
      //   return (
      //     <div>
      //       <p>Hello</p>
      //       {blogs.map((blog, index) => (
      //         <>
      //           <p key={index}>{console.log(blog.content)}</p>
      //           <p>{blog.content}</p>
      //         </>
      //       ))}
      //     </div>
      //   );
      // }

      function App() {
        const blogs = [
          {
            title: "React Basics",
            content: "Learn the basics of React.",
            isFeatured: true,
          },
          {
            title: "Advanced React",
            content: "Delve deeper into React.",
            isFeatured: false,
          },
        ];
        return (
          <>
            <main>
              {blogs.map((blog, index) => (
                <BlogCard
                  key={index}
                  title={blog.title}
                  content={blog.content}
                  isFeatured={blog.isFeatured}
                />
              ))}
            </main>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
